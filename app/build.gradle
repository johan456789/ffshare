plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.thyu.ffshare"
        minSdk 26
        targetSdk 34
        versionCode 23
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    // Release signing: CI writes key.properties (see sign-android action),
    // local builds use FFSHARE_RELEASE_* from ~/.gradle/gradle.properties.
    // When neither is present the release build stays unsigned (plain CI).
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file("key.properties")
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }
    def releaseStoreFile = keystoreProps.getProperty("storeFile") ?: findProperty("FFSHARE_RELEASE_STORE_FILE")
    def releaseStorePassword = keystoreProps.getProperty("storePassword") ?: findProperty("FFSHARE_RELEASE_STORE_PASSWORD")
    def releaseKeyAlias = keystoreProps.getProperty("keyAlias") ?: findProperty("FFSHARE_RELEASE_KEY_ALIAS")
    def releaseKeyPassword = keystoreProps.getProperty("keyPassword") ?: findProperty("FFSHARE_RELEASE_KEY_PASSWORD")
    def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    
    splits {
        // Configures multiple APKs based on ABI.
        abi {
          // Enables building multiple APKs per ABI.
          enable true

          // Resets the list of ABIs for Gradle to create APKs for to none.
          reset()

          //noinspection ChromeOsAbiSupport
          include "armeabi-v7a", "arm64-v8a"

          // Create apk with merged ABI libraries
          universalApk true
        }
    }

    buildTypes {
        release {
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            minifyEnabled false
        }

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    namespace 'com.caydey.ffshare'
}
dependencies {
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.1'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.1'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.preference:preference-ktx:1.2.0'

    implementation(files('libs/ffmpeg-kit-next-8.1.1.aar'))
    implementation 'com.arthenica:smart-exception-java:0.2.1'

    implementation 'com.jakewharton.timber:timber:5.0.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}